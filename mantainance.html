<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      padding: 40px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      color: #111827;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: #4b5563;
    }

    .info {
      font-size: 0.95rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Will be back soon</h1>
    <p>site is currently undergoing scheduled maintenance..</p>
    <div class="info">Thank you for your patience.</div>
  </div>
</body>
</html>
